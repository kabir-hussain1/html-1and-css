
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | General Information</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>PRO ZERO</h2>

        <nav>
            <a href="../class8/index.html">Home</a>
            <a href="../class8/sign1.html">Sign Up</a>
        </nav>
    </header>

    <main>
        <video class="bg-video" autoplay muted loop playsinline>
            <source src="background.mp4" type="video/mp4">
        </video>

        <div class="form-container">

            <h1>General Information</h1>
            <p>Step 1 of 4</p>

            <form action="signup2.html" method="get">

                <label for="name">Full Name</label>
                <input type="text" id="name" name="name"
                    placeholder="Enter your full name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email"
                    placeholder="Enter your email" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                    placeholder="Create a password" required>

                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" required>

                <label>Gender</label>

                <div class="radio-group">
                    <label>
                        <input type="radio" name="gender" value="Male" required>
                        Male
                    </label>

                    <label>
                        <input type="radio" name="gender" value="Female">
                        Female
                    </label>

                    <label>
                        <input type="radio" name="gender" value="Other">
                        Other
                    </label>
                </div>

                <label for="profile">Profile Picture</label>
                <input type="file" id="profile" name="profile"
                    accept="image/*">

                <button type="submit"><a href="./sign2.html">next</a></button>

            </form>

            <a class="back-link" href="../class8/index.html">Back to Home</a>

        </div>
    </main>

    <footer>
        <p>&copy; 2026 PRO ZERO. All Rights Reserved.</p>
    </footer>

</body>
</html>
