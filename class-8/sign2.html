
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Contact Information</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>PRO ZERO</h2>

        <nav>
            <a href="index.html">Home</a>
            <a href="signup1.html">Sign Up</a>
        </nav>
    </header>

    <main>
        <video class="bg-video" autoplay muted loop playsinline>
            <source src="background.mp4" type="video/mp4">
        </video>

        <div class="form-container">

            <h1>Contact Information</h1>
            <p>Step 2 of 4</p>

            <form action="signup3.html" method="get">

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone"
                    placeholder="Enter your phone number" required>

                <label for="country">Country</label>
                <input list="countries" id="country" name="country"
                    placeholder="Select your country" required>

                <datalist id="countries">
                    <option value="Pakistan">
                    <option value="India">
                    <option value="China">
                    <option value="United States">
                    <option value="United Kingdom">
                    <option value="Canada">
                    <option value="Australia">
                    <option value="United Arab Emirates">
                </datalist>

                <label for="address">Address</label>
                <input type="text" id="address" name="address"
                    placeholder="Enter your street address" required>

                <label for="details">Complete Address</label>
                <textarea id="details" name="details"
                    placeholder="Enter your complete address"
                    rows="4" required></textarea>

                <label for="contact">Preferred Contact Method</label>
                <select id="contact" name="contact" required>
                    <option value="">Choose a method</option>
                    <option value="Email">Email</option>
                    <option value="Phone">Phone</option>
                    <option value="SMS">SMS</option>
                </select>

                <div class="checkbox-group">
                    <label>
                        <input type="checkbox" name="agreement"
                            value="Accepted" required>
                        I agree to the Terms and Conditions
                    </label>
                </div>

                <div class="button-group">
                    <a class="back-button" href="./sign1.html">Back</a>
                    <button type="submit"><a href="./sign3.html">Next</a>Next</button>
                </div>

            </form>

        </div>
    </main>

    <footer>
        <p>&copy; 2026 PRO ZERO. All Rights Reserved.</p>
    </footer>

</body>
</html>
