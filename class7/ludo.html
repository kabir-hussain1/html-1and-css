
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Board</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #222;
            font-family: Arial, sans-serif;
        }

        .game {
            width: min(94vw, 600px);
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 15px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            aspect-ratio: 1;
            border: 3px solid black;
            background: white;
        }

        .cell {
            border: 1px solid #555;
            display: flex;
            justify-content: center;
            align-items: center;
            min-width: 0;
            min-height: 0;
        }

        .red { background: #e53935; }
        .green { background: #43a047; }
        .blue { background: #1e88e5; }
        .yellow { background: #fdd835; }

        .white { background: white; }

        .home {
            grid-column: span 6;
            grid-row: span 6;
            padding: 12%;
            border: 2px solid black;
        }

        .tokens {
            width: 100%;
            height: 100%;
            background: white;
            border: 3px solid #222;
            border-radius: 8px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 10%;
            padding: 12%;
        }

        .token {
            width: 75%;
            height: 75%;
            border: 2px solid black;
            border-radius: 50%;
            justify-self: center;
            align-self: center;
        }

        .red-token { background: red; }
        .green-token { background: green; }
        .blue-token { background: blue; }
        .yellow-token { background: #fdd835; }

        .center {
            grid-column: 7 / 10;
            grid-row: 7 / 10;
            background: conic-gradient(
                red 0deg 90deg,
                green 90deg 180deg,
                yellow 180deg 270deg,
                blue 270deg 360deg
            );
            border: 2px solid black;
        }
    </style>
</head>

<body>

<div class="game">

    <h1>LUDO GAME</h1>

    <div class="board">

        <!-- Four equal home areas -->

        <div class="cell home red" style="grid-column:1 / 7; grid-row:1 / 7;">
            <div class="tokens">
                <div class="token red-token"></div>
                <div class="token red-token"></div>
                <div class="token red-token"></div>
                <div class="token red-token"></div>
            </div>
        </div>

        <div class="cell home green" style="grid-column:10 / 16; grid-row:1 / 7;">
            <div class="tokens">
                <div class="token green-token"></div>
                <div class="token green-token"></div>
                <div class="token green-token"></div>
                <div class="token green-token"></div>
            </div>
        </div>

        <div class="cell home blue" style="grid-column:1 / 7; grid-row:10 / 16;">
            <div class="tokens">
                <div class="token blue-token"></div>
                <div class="token blue-token"></div>
                <div class="token blue-token"></div>
                <div class="token blue-token"></div>
            </div>
        </div>

        <div class="cell home yellow" style="grid-column:10 / 16; grid-row:10 / 16;">
            <div class="tokens">
                <div class="token yellow-token"></div>
                <div class="token yellow-token"></div>
                <div class="token yellow-token"></div>
                <div class="token yellow-token"></div>
            </div>
        </div>

        <!-- Center -->

        <div class="cell center"></div>

        <!-- Vertical paths -->

        <div class="cell white" style="grid-column:7; grid-row:1;"></div>
        <div class="cell green" style="grid-column:8; grid-row:1;"></div>
        <div class="cell white" style="grid-column:9; grid-row:1;"></div>

        <div class="cell white" style="grid-column:7; grid-row:2;"></div>
        <div class="cell green" style="grid-column:8; grid-row:2;"></div>
        <div class="cell green" style="grid-column:9; grid-row:2;"></div>

        <div class="cell white" style="grid-column:7; grid-row:3;"></div>
        <div class="cell green" style="grid-column:8; grid-row:3;"></div>
        <div class="cell white" style="grid-column:9; grid-row:3;"></div>

        <div class="cell white" style="grid-column:7; grid-row:4;"></div>
        <div class="cell green" style="grid-column:8; grid-row:4;"></div>
        <div class="cell white" style="grid-column:9; grid-row:4;"></div>

        <div class="cell white" style="grid-column:7; grid-row:5;"></div>
        <div class="cell green" style="grid-column:8; grid-row:5;"></div>
        <div class="cell white" style="grid-column:9; grid-row:5;"></div>

        <div class="cell white" style="grid-column:7; grid-row:6;"></div>
        <div class="cell green" style="grid-column:8; grid-row:6;"></div>
        <div class="cell white" style="grid-column:9; grid-row:6;"></div>

        <div class="cell white" style="grid-column:7; grid-row:10;"></div>
        <div class="cell blue" style="grid-column:8; grid-row:10;"></div>
        <div class="cell white" style="grid-column:9; grid-row:10;"></div>

        <div class="cell white" style="grid-column:7; grid-row:11;"></div>
        <div class="cell blue" style="grid-column:8; grid-row:11;"></div>
        <div class="cell white" style="grid-column:9; grid-row:11;"></div>

        <div class="cell white" style="grid-column:7; grid-row:12;"></div>
        <div class="cell blue" style="grid-column:8; grid-row:12;"></div>
        <div class="cell white" style="grid-column:9; grid-row:12;"></div>

        <div class="cell white" style="grid-column:7; grid-row:13;"></div>
        <div class="cell blue" style="grid-column:8; grid-row:13;"></div>
        <div class="cell white" style="grid-column:9; grid-row:13;"></div>

        <div class="cell white" style="grid-column:7; grid-row:14;"></div>
        <div class="cell blue" style="grid-column:8; grid-row:14;"></div>
        <div class="cell white" style="grid-column:9; grid-row:14;"></div>

        <div class="cell white" style="grid-column:7; grid-row:15;"></div>
        <div class="cell blue" style="grid-column:8; grid-row:15;"></div>
        <div class="cell white" style="grid-column:9; grid-row:15;"></div>

        <!-- Horizontal paths -->

        <div class="cell white" style="grid-column:1; grid-row:7;"></div>
        <div class="cell red" style="grid-column:2; grid-row:7;"></div>
        <div class="cell red" style="grid-column:3; grid-row:7;"></div>
        <div class="cell red" style="grid-column:4; grid-row:7;"></div>
        <div class="cell red" style="grid-column:5; grid-row:7;"></div>
        <div class="cell white" style="grid-column:6; grid-row:7;"></div>

        <div class="cell white" style="grid-column:1; grid-row:8;"></div>
        <div class="cell red" style="grid-column:2; grid-row:8;"></div>
        <div class="cell red" style="grid-column:3; grid-row:8;"></div>
        <div class="cell red" style="grid-column:4; grid-row:8;"></div>
        <div class="cell red" style="grid-column:5; grid-row:8;"></div>
        <div class="cell red" style="grid-column:6; grid-row:8;"></div>

        <div class="cell white" style="grid-column:1; grid-row:9;"></div>
        <div class="cell white" style="grid-column:2; grid-row:9;"></div>
        <div class="cell white" style="grid-column:3; grid-row:9;"></div>
        <div class="cell white" style="grid-column:4; grid-row:9;"></div>
        <div class="cell white" style="grid-column:5; grid-row:9;"></div>
        <div class="cell white" style="grid-column:6; grid-row:9;"></div>

        <div class="cell white" style="grid-column:10; grid-row:7;"></div>
        <div class="cell white" style="grid-column:11; grid-row:7;"></div>
        <div class="cell white" style="grid-column:12; grid-row:7;"></div>
        <div class="cell white" style="grid-column:13; grid-row:7;"></div>
        <div class="cell white" style="grid-column:14; grid-row:7;"></div>
        <div class="cell white" style="grid-column:15; grid-row:7;"></div>

        <div class="cell yellow" style="grid-column:10; grid-row:8;"></div>
        <div class="cell yellow" style="grid-column:11; grid-row:8;"></div>
        <div class="cell yellow" style="grid-column:12; grid-row:8;"></div>
        <div class="cell yellow" style="grid-column:13; grid-row:8;"></div>
        <div class="cell yellow" style="grid-column:14; grid-row:8;"></div>
        <div class="cell white" style="grid-column:15; grid-row:8;"></div>

        <div class="cell white" style="grid-column:10; grid-row:9;"></div>
        <div class="cell white" style="grid-column:11; grid-row:9;"></div>
        <div class="cell white" style="grid-column:12; grid-row:9;"></div>
        <div class="cell white" style="grid-column:13; grid-row:9;"></div>
        <div class="cell yellow" style="grid-column:14; grid-row:9;"></div>
        <div class="cell white" style="grid-column:15; grid-row:9;"></div>

    </div>
</div>

</body>
</html>
